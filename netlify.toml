[build]
  publish = "site"

[[redirects]]
  from = "/"
  to = "/sv/"
  status = 302
  conditions = {Language = ["sv"]}

[[redirects]]
  from = "/"
  to = "/da/"
  status = 302
  conditions = {Language = ["da"]}

[[redirects]]
  from = "/"
  to = "/no/"
  status = 302
  conditions = {Language = ["no"]}

[[redirects]]
  from = "/"
  to = "/fi/"
  status = 302
  conditions = {Language = ["fi"]}

[[redirects]]
  from = "/"
  to = "/de/"
  status = 302
  conditions = {Language = ["de"]}

[[redirects]]
  from = "/legal/privacy-policy"
  to = "/privacy-policy.html"
  status = 301

[[redirects]]
  from = "/legal/privacy-policy/"
  to = "/privacy-policy.html"
  status = 301

[[redirects]]
  from = "/legal/cookie-policy"
  to = "/cookie-policy.html"
  status = 301

[[redirects]]
  from = "/legal/cookie-policy/"
  to = "/cookie-policy.html"
  status = 301

# Markdown variants for AI agents (generated by build.js; see netlify/edge-functions/markdown.ts)
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# CSS bundles are content-hashed by build.js — safe to cache forever
[[headers]]
  for = "/css/bundle/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
